<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Logicory - Mathematical Factory</title>
    <style>
        :root { --bg-primary:#0a0a0f; --bg-secondary:#12121a; --bg-tertiary:#1a1a25; --text-primary:#f0f0f5; --text-secondary:#a0a0b0; --accent-primary:#7c4dff; --accent-secondary:#536dfe; --accent-glow:rgba(124,77,255,0.3); --danger:#ff5252; --success:#69f0ae; --math-font:'Courier New',monospace }
        *{box-sizing:border-box;user-select:none}
        body{margin:0;overflow:hidden;background:var(--bg-primary);color:var(--text-primary);font-family:'Segoe UI',system-ui,sans-serif}
        canvas{display:block;cursor:crosshair}
        #ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
        .panel{position:absolute;background:linear-gradient(135deg,var(--bg-secondary),var(--bg-tertiary));padding:16px;border-radius:4px;pointer-events:auto;border:1px solid rgba(124,77,255,0.2);backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
        .panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-primary),transparent)}
        .math-text{font-family:var(--math-font);letter-spacing:1px}
        #top-bar{top:16px;left:16px;display:flex;gap:8px;align-items:center}
        .game-title{font-size:20px;font-weight:300;letter-spacing:4px;color:var(--accent-primary);margin-right:20px;text-shadow:0 0 20px var(--accent-glow)}
        .stat-box{background:rgba(0,0,0,0.3);padding:6px 12px;border-radius:2px;font-family:var(--math-font);font-size:12px;border:1px solid rgba(255,255,255,0.1)}
        .stat-label{color:var(--text-secondary);margin-right:8px}
        .btn{background:transparent;border:1px solid var(--accent-secondary);color:var(--accent-secondary);padding:6px 16px;border-radius:2px;cursor:pointer;font-family:var(--math-font);font-size:12px;transition:all 0.2s;text-transform:uppercase;letter-spacing:1px}
        .btn:hover{background:var(--accent-primary);color:#fff;box-shadow:0 0 20px var(--accent-glow)}
        .btn-danger{border-color:var(--danger);color:var(--danger)}
        .btn-danger:hover{background:var(--danger);color:#fff}
        #toolbar{bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:12px}
        .tool-btn{width:70px;height:70px;background:var(--bg-tertiary);border:1px solid rgba(255,255,255,0.1);border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;transition:all 0.2s;color:var(--text-secondary);position:relative;overflow:hidden}
        .tool-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent-primary);transform:scaleX(0);transition:transform 0.2s}
        .tool-btn:hover{background:var(--bg-secondary);color:var(--text-primary);border-color:rgba(124,77,255,0.5)}
        .tool-btn:hover::after,.tool-btn.active::after{transform:scaleX(1)}
        .tool-btn.active{background:var(--bg-secondary);color:var(--accent-primary);border-color:var(--accent-primary);box-shadow:0 0 15px var(--accent-glow)}
        .tool-icon{font-size:28px;margin-bottom:6px;opacity:0.8}
        .tool-btn.active .tool-icon{opacity:1}
        #inspector{top:16px;right:16px;width:320px;display:none;max-height:calc(100vh - 32px);overflow-y:auto}
        #inspector h3{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.1);font-weight:300;letter-spacing:2px;font-size:14px;color:var(--accent-primary)}
        .prop-row{margin-bottom:12px;display:flex;align-items:center;gap:10px}
        .prop-label{font-family:var(--math-font);font-size:11px;color:var(--text-secondary);min-width:60px}
        select,input[type="text"],input[type="number"]{background:var(--bg-primary);border:1px solid rgba(255,255,255,0.1);color:var(--text-primary);padding:8px 10px;border-radius:2px;font-family:var(--math-font);font-size:12px;flex:1}
        select:focus,input:focus{outline:none;border-color:var(--accent-primary)}
        .logic-block{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.05);border-radius:2px;padding:12px;margin-bottom:12px}
        .logic-header{font-family:var(--math-font);font-size:10px;color:var(--accent-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
        .logic-rule{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;padding:8px;background:rgba(124,77,255,0.05);border-radius:2px;border-left:2px solid var(--accent-primary)}
        .logic-operator{color:var(--accent-secondary);font-family:var(--math-font);font-size:14px}
        .btn-small{padding:4px 10px;font-size:10px}
        .btn-add{width:100%;margin-top:8px;border-style:dashed}
        #minimap-container{position:absolute;bottom:16px;right:16px;width:180px;height:180px;background:var(--bg-secondary);border:1px solid rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
        #minimap{width:100%;height:100%}
        #camera-hint{position:absolute;bottom:210px;right:16px;font-family:var(--math-font);font-size:10px;color:var(--text-secondary);text-align:right;line-height:1.6}
        #modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:1000;backdrop-filter:blur(5px)}
        .modal{background:linear-gradient(135deg,var(--bg-secondary),var(--bg-tertiary));padding:40px;border-radius:4px;width:420px;text-align:center;border:1px solid rgba(124,77,255,0.3);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
        .modal h2{color:var(--accent-primary);margin:0 0 16px;font-weight:300;letter-spacing:3px}
        .modal p{color:var(--text-secondary);line-height:1.6}
        .modal-actions{display:flex;gap:12px;margin-top:24px}
        .modal-actions .btn{flex:1}
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div id="top-bar" class="panel">
        <span class="game-title math-text">LOGICORY</span>
        <div class="stat-box"><span class="stat-label">FPS</span><span id="fps-counter">60</span></div>
        <div class="stat-box"><span class="stat-label">ENTITIES</span><span id="entity-counter">0</span></div>
        <div class="stat-box"><span class="stat-label">ITEMS</span><span id="item-counter">0</span></div>
        <button class="btn" onclick="Game.saveGame()">Save</button>
        <button class="btn" onclick="Game.loadGame()">Load</button>
        <button class="btn btn-danger" onclick="Game.resetGame()">Reset</button>
    </div>
    <div id="inspector" class="panel">
        <h3 id="inspector-title" class="math-text">PROPERTIES</h3>
        <div id="inspector-content"></div>
    </div>
    <div id="toolbar" class="panel">
        <div class="tool-btn active" onclick="Game.setTool('cursor')" data-tool="cursor"><span class="tool-icon">⟲</span><span class="math-text">SELECT</span></div>
        <div class="tool-btn" onclick="Game.setTool('extractor')" data-tool="extractor"><span class="tool-icon">⬡</span><span class="math-text">EXTRACTOR</span></div>
        <div class="tool-btn" onclick="Game.setTool('belt')" data-tool="belt"><span class="tool-icon">→</span><span class="math-text">CONVEYOR</span></div>
        <div class="tool-btn" onclick="Game.setTool('splitter')" data-tool="splitter"><span class="tool-icon">⫷</span><span class="math-text">SPLITTER</span></div>
        <div class="tool-btn" onclick="Game.setTool('processor')" data-tool="processor"><span class="tool-icon">∑</span><span class="math-text">PROCESSOR</span></div>
        <div class="tool-btn" onclick="Game.setTool('assembler')" data-tool="assembler"><span class="tool-icon">⨁</span><span class="math-text">ASSEMBLER</span></div>
    </div>
    <div id="minimap-container" class="panel" style="padding:0"><canvas id="minimap"></canvas></div>
    <div id="camera-hint">[WASD/ARROWS] Pan<br>[SPACE+Drag] Pan<br>[R] Rotate<br>[DEL] Delete<br>[SCROLL] Zoom</div>
</div>
<div id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title" class="math-text">NOTIFICATION</h2>
        <p id="modal-msg">Operation completed</p>
        <div class="modal-actions"><button class="btn" onclick="document.getElementById('modal-overlay').style.display='none'">CONFIRM</button></div>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>
