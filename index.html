<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Logic Factory: Predicate Automation</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --grid-line: #2a2a2a;
            --ui-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent: #4caf50;
            --danger: #f44336;
        }
        body { margin: 0; overflow: hidden; background: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .panel { position: absolute; background: var(--ui-bg); padding: 15px; border-radius: 8px; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #444; }
        
        /* Toolbar */
        #toolbar { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .tool-btn { width: 60px; height: 60px; background: #333; border: 2px solid #555; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; transition: 0.2s; }
        .tool-btn:hover { background: #444; border-color: var(--accent); }
        .tool-btn.active { background: #222; border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .tool-icon { font-size: 24px; margin-bottom: 4px; }

        /* Inspector / Logic Editor */
        #inspector { top: 20px; right: 20px; width: 300px; display: none; }
        #inspector h3 { margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .logic-row { margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        select, input { background: #222; border: 1px solid #555; color: white; padding: 5px; border-radius: 4px; width: 100%; }
        button { background: var(--accent); border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button.delete { background: var(--danger); margin-top: 10px; }

        /* Top Bar */
        #top-bar { top: 20px; left: 20px; display: flex; gap: 10px; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-family: monospace; }

        /* Modal */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
        .modal { background: var(--ui-bg); padding: 30px; border-radius: 10px; width: 400px; text-align: center; }
        .modal h2 { color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; }

    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <!-- Top Stats -->
    <div id="top-bar" class="panel" style="position: relative; display: inline-flex;">
        <div class="stat-box">FPS: <span id="fps-counter">60</span></div>
        <div class="stat-box">Entities: <span id="entity-counter">0</span></div>
        <button onclick="Game.saveGame()" style="width: auto; padding: 5px 10px; margin-left: 10px;">💾 存档</button>
        <button onclick="Game.loadGame()" style="width: auto; padding: 5px 10px; background: #2196F3;">📂 读档</button>
        <button onclick="Game.resetGame()" style="width: auto; padding: 5px 10px; background: #f44336;">🗑️ 重置</button>
    </div>

    <!-- Inspector -->
    <div id="inspector" class="panel">
        <h3 id="inspector-title">建筑属性</h3>
        <div id="inspector-content">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar" class="panel">
        <div class="tool-btn active" onclick="Game.setTool('cursor')" data-tool="cursor">
            <span class="tool-icon">👆</span>
            <span>选择</span>
        </div>
        <div class="tool-btn" onclick="Game.setTool('miner')" data-tool="miner">
            <span class="tool-icon">⛏️</span>
            <span>采矿机</span>
        </div>
        <div class="tool-btn" onclick="Game.setTool('belt')" data-tool="belt">
            <span class="tool-icon">➡️</span>
            <span>传送带</span>
        </div>
        <div class="tool-btn" onclick="Game.setTool('processor')" data-tool="processor">
            <span class="tool-icon">🧠</span>
            <span>逻辑处理器</span>
        </div>
        <div class="tool-btn" onclick="Game.setTool('assembler')" data-tool="assembler">
            <span class="tool-icon">🏭</span>
            <span>组装机</span>
        </div>
    </div>
</div>

<!-- Save/Load Modal -->
<div id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">消息</h2>
        <p id="modal-msg">操作成功</p>
        <div class="modal-actions">
            <button onclick="document.getElementById('modal-overlay').style.display='none'">关闭</button>
        </div>
    </div>
</div>

<script>
/**
 * LOGIC FACTORY ENGINE
 * 
 * Core Concepts:
 * 1. Grid: 2D Array of Tiles.
 * 2. Items: Objects moving on belts with Properties (Shape, Color, Material).
 * 3. Logic: Predicates evaluated on items to control machines.
 */

// --- Constants & Config ---
const TILE_SIZE = 64;
const COLORS = {
    RED: '#ff5252', GREEN: '#69f0ae', BLUE: '#448aff',
    IRON: '#b0bec5', GOLD: '#ffd740', CRYSTAL: '#e040fb'
};
const SHAPES = ['CIRCLE', 'SQUARE', 'TRIANGLE'];
const DIRS = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DIR_VECTORS = [{x:0, y:-1}, {x:1, y:0}, {x:0, y:1}, {x:-1, y:0}];

// --- Math & Logic Helpers ---
const Utils = {
    rand: (arr) => arr[Math.floor(Math.random() * arr.length)],
    rectIntersect: (r1, r2) => !(r2.left > r1.right || r2.right < r1.left || r2.top > r1.bottom || r2.bottom < r1.top),
    
    // The Core Innovation: Predicate Evaluation
    evaluatePredicate: (item, predicate) => {
        if (!item) return false;
        const { type, property, value, quantifier } = predicate;
        
        // Simple logic: item.property == value
        let match = false;
        if (property === 'shape') match = item.shape === value;
        if (property === 'color') match = item.color === value;
        if (property === 'material') match = item.material === value;

        if (type === 'EQUALS') return match;
        if (type === 'NOT') return !match;
        return match;
    }
};

// --- Classes ---

class Item {
    constructor(shape, color, material) {
        this.shape = shape;
        this.color = color;
        this.material = material;
        this.x = 0;
        this.y = 0;
        this.progress = 0; // 0 to 1 along the tile
        this.speed = 0.03;
        this.markedForDeletion = false;
    }

    draw(ctx, x, y) {
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        const cx = x + TILE_SIZE/2;
        const cy = y + TILE_SIZE/2;
        const s = TILE_SIZE/3;

        if (this.shape === 'CIRCLE') {
            ctx.arc(cx, cy, s, 0, Math.PI*2);
        } else if (this.shape === 'SQUARE') {
            ctx.rect(cx - s, cy - s, s*2, s*2);
        } else if (this.shape === 'TRIANGLE') {
            ctx.moveTo(cx, cy - s);
            ctx.lineTo(cx + s, cy + s);
            ctx.lineTo(cx - s, cy + s);
            ctx.closePath();
        }
        ctx.fill();
        ctx.stroke();

        // Material indicator (small dot)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx + s/1.5, cy - s/1.5, 3, 0, Math.PI*2);
        ctx.fill();
    }
}

class Building {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.direction = DIRS.RIGHT;
        this.inventory = []; // Input buffer
        this.outputBuffer = null; // Output slot
        this.config = {}; // Logic config
        this.timer = 0;
    }

    update(grid, dt) {
        // Override in subclasses
    }

    draw(ctx, x, y) {
        // Base drawing
        ctx.fillStyle = '#444';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#666';
        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
    }
}

class Miner extends Building {
    constructor(x, y) {
        super(x, y, 'miner');
        this.speed = 60; // Ticks per item
        this.config = { shape: 'CIRCLE', color: 'RED', material: 'IRON' };
    }

    update(grid) {
        if (this.outputBuffer) return; // Blocked
        
        this.timer++;
        if (this.timer >= this.speed) {
            this.timer = 0;
            this.outputBuffer = new Item(this.config.shape, this.config.color, this.config.material);
        }
    }

    draw(ctx, x, y) {
        super.draw(ctx, x, y);
        // Draw drill head
        ctx.fillStyle = '#ffa726';
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, 15, 0, Math.PI*2);
        ctx.fill();
        // Direction indicator
        const dir = DIR_VECTORS[this.direction];
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + TILE_SIZE/2 + dir.x*20 - 2, y + TILE_SIZE/2 + dir.y*20 - 2, 4, 4);
    }
}

class Belt extends Building {
    constructor(x, y) {
        super(x, y, 'belt');
        this.items = []; // Items currently on this tile
    }

    update(grid) {
        // Move items
        for (let i = this.items.length - 1; i >= 0; i--) {
            let item = this.items[i];
            item.progress += item.speed;
            
            if (item.progress >= 1) {
                // Try move to next tile
                const nextDir = this.direction;
                const nx = this.x + DIR_VECTORS[nextDir].x;
                const ny = this.y + DIR_VECTORS[nextDir].y;
                
                const nextTile = grid.getTile(nx, ny);
                let moved = false;

                if (nextTile && nextTile.building) {
                    const b = nextTile.building;
                    // Accept into building input?
                    if (b.inventory.length < 4 && !b.outputBuffer) {
                         // Simplified: Direct push to output buffer if empty, else inventory
                         if(!b.outputBuffer) {
                             b.outputBuffer = item;
                             moved = true;
                         } else if (b.inventory.length < 4) {
                             b.inventory.push(item);
                             moved = true;
                         }
                    }
                } else if (nextTile && nextTile.type === 'belt' && nextTile.building) {
                    // Next is belt
                    const nextBelt = nextTile.building;
                    // Only enter if aligned? For now, allow any belt entry if space
                    if (nextBelt.items.length < 4) {
                        item.x = nx;
                        item.y = ny;
                        item.progress = 0;
                        item.speed = nextBelt.direction === this.direction ? 0.03 : 0.02; // Penalty for turning
                        nextBelt.items.push(item);
                        moved = true;
                    }
                }

                if (!moved) {
                    // Stay here, clamp progress
                    item.progress = 0.99; 
                } else {
                    this.items.splice(i, 1);
                }
            }
        }

        // Accept from previous tile (Handled by previous tile pushing)
        // Accept from building output
        if (this.inventory.length > 0 && this.items.length < 4) {
             // This logic is inverted: Buildings push to belts. 
             // Belts don't pull from buildings in this simple model, buildings push.
        }
    }

    draw(ctx, x, y) {
        ctx.fillStyle = '#333';
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        
        // Arrow
        ctx.save();
        ctx.translate(x + TILE_SIZE/2, y + TILE_SIZE/2);
        ctx.rotate(this.direction * 90 * Math.PI / 180);
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.moveTo(-10, 10);
        ctx.lineTo(0, -15);
        ctx.lineTo(10, 10);
        ctx.fill();
        ctx.restore();

        // Draw Items
        this.items.forEach(item => {
            const dx = DIR_VECTORS[this.direction].x * item.progress * TILE_SIZE;
            const dy = DIR_VECTORS[this.direction].y * item.progress * TILE_SIZE;
            // Center offset
            const offsetX = (this.direction === 1 || this.direction === 3) ? 0 : (item.progress - 0.5) * TILE_SIZE;
            const offsetY = (this.direction === 0 || this.direction === 2) ? 0 : (item.progress - 0.5) * TILE_SIZE;
            
            // Correct movement visualization
            let drawX = x;
            let drawY = y;
            
            if(this.direction === DIRS.RIGHT) drawX += item.progress * TILE_SIZE;
            if(this.direction === DIRS.LEFT) drawX += (1-item.progress) * TILE_SIZE;
            if(this.direction === DIRS.DOWN) drawY += item.progress * TILE_SIZE;
            if(this.direction === DIRS.UP) drawY += (1-item.progress) * TILE_SIZE;

            item.draw(ctx, drawX, drawY);
        });
    }
}

class Processor extends Building {
    constructor(x, y) {
        super(x, y, 'processor');
        // Logic Configuration: The "Code"
        this.config = {
            rules: [
                { active: true, type: 'EQUALS', property: 'color', value: 'RED', action: 'DELETE' }
            ]
        };
        this.processTime = 20;
    }

    update(grid) {
        // Pull from inventory
        if (!this.outputBuffer && this.inventory.length > 0) {
            const item = this.inventory.shift();
            this.processingItem = item;
            this.timer = 0;
        }

        if (this.processingItem) {
            this.timer++;
            if (this.timer >= this.processTime) {
                // Apply Logic
                let keep = true;
                this.config.rules.forEach(rule => {
                    if (!rule.active) return;
                    if (Utils.evaluatePredicate(this.processingItem, rule)) {
                        if (rule.action === 'DELETE') keep = false;
                        if (rule.action === 'CHANGE_COLOR') this.processingItem.color = rule.targetValue;
                    }
                });

                if (keep) {
                    this.outputBuffer = this.processingItem;
                } else {
                    // Destroyed
                }
                this.processingItem = null;
            }
        }
    }

    draw(ctx, x, y) {
        super.draw(ctx, x, y);
        ctx.fillStyle = '#2196F3';
        ctx.fillRect(x + 10, y + 10, TILE_SIZE - 20, TILE_SIZE - 20);
        
        // Draw "Code" lines visually
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.fillText("IF", x + 15, y + 25);
        if(this.config.rules.length > 0) {
            ctx.fillText(this.config.rules[0].property.substr(0,3).toUpperCase(), x + 15, y + 40);
        }
    }
}

class Assembler extends Building {
    constructor(x, y) {
        super(x, y, 'assembler');
        this.recipe = { inputs: ['CIRCLE', 'SQUARE'], output: 'TRIANGLE' }; // Simplified
        this.timer = 0;
    }

    update(grid) {
        if (this.outputBuffer) return;
        if (this.inventory.length >= 2) {
            this.timer++;
            if (this.timer >= 40) {
                this.inventory.splice(0, 2); // Consume 2
                this.outputBuffer = new Item('TRIANGLE', 'GREEN', 'IRON'); // Hardcoded recipe for demo
                this.timer = 0;
            }
        }
    }

    draw(ctx, x, y) {
        super.draw(ctx, x, y);
        ctx.fillStyle = '#9c27b0';
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 10);
        ctx.lineTo(x + TILE_SIZE - 10, y + 10);
        ctx.lineTo(x + TILE_SIZE/2, y + TILE_SIZE - 10);
        ctx.fill();
    }
}

// --- Game Engine ---

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: document.getElementById('gameCanvas').getContext('2d'),
    width: 0,
    height: 0,
    gridSize: { w: 0, h: 0 },
    grid: [],
    camera: { x: 0, y: 0 },
    tool: 'cursor',
    selectedBuilding: null,
    lastTime: 0,

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupInput();
        this.createGrid(50, 50);
        this.loadGame(); // Try load, else default
        requestAnimationFrame(t => this.loop(t));
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.ctx.imageSmoothingEnabled = false;
    },

    createGrid(w, h) {
        this.gridSize = { w, h };
        this.grid = new Array(w * h).fill(null).map(() => ({ type: 'empty', building: null }));
    },

    getTile(x, y) {
        if (x < 0 || x >= this.gridSize.w || y < 0 || y >= this.gridSize.h) return null;
        return this.grid[y * this.gridSize.w + x];
    },

    loop(timestamp) {
        const dt = timestamp - this.lastTime;
        this.lastTime = timestamp;

        this.update();
        this.render();
        
        document.getElementById('fps-counter').innerText = Math.round(1000/dt);
        let entityCount = 0;
        this.grid.forEach(t => {
            if(t.building) {
                entityCount++;
                if(t.building.items) entityCount += t.building.items.length;
                if(t.building.inventory) entityCount += t.building.inventory.length;
            }
        });
        document.getElementById('entity-counter').innerText = entityCount;

        requestAnimationFrame(t => this.loop(t));
    },

    update() {
        // Update all buildings
        for (let y = 0; y < this.gridSize.h; y++) {
            for (let x = 0; x < this.gridSize.w; x++) {
                const tile = this.getTile(x, y);
                if (tile.building) {
                    tile.building.update(this);
                    
                    // Push output to adjacent belt
                    if (tile.building.outputBuffer) {
                        const dir = tile.building.direction;
                        const nx = x + DIR_VECTORS[dir].x;
                        const ny = y + DIR_VECTORS[dir].y;
                        const next = this.getTile(nx, ny);
                        
                        if (next && next.building && next.building.type === 'belt') {
                            if (next.building.items.length < 4) {
                                const item = tile.building.outputBuffer;
                                item.x = nx;
                                item.y = ny;
                                item.progress = 0;
                                next.building.items.push(item);
                                tile.building.outputBuffer = null;
                            }
                        }
                    }
                }
            }
        }
    },

    render() {
        // Clear
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();
        // Camera Transform (Center map roughly)
        const offsetX = (this.width - this.gridSize.w * TILE_SIZE) / 2;
        const offsetY = (this.height - this.gridSize.h * TILE_SIZE) / 2;
        this.ctx.translate(offsetX, offsetY);

        // Draw Grid
        for (let y = 0; y < this.gridSize.h; y++) {
            for (let x = 0; x < this.gridSize.w; x++) {
                const tile = this.getTile(x, y);
                const px = x * TILE_SIZE;
                const py = y * TILE_SIZE;

                // Grid lines
                this.ctx.strokeStyle = '#2a2a2a';
                this.ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

                if (tile.building) {
                    tile.building.draw(this.ctx, px, py);
                    
                    // Draw Inventory/Input slots
                    if(tile.building.inventory && tile.building.inventory.length > 0) {
                        this.ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        this.ctx.fillRect(px + 5, py + 5, 10, 10);
                    }
                }
            }
        }

        this.ctx.restore();
    },

    setupInput() {
        // Mouse Interaction
        this.canvas.addEventListener('mousedown', e => this.handleInput(e, 'down'));
        this.canvas.addEventListener('mousemove', e => this.handleInput(e, 'move'));
        this.canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            this.rotateSelected();
        });

        // UI Buttons
        // Handled in HTML onclicks
    },

    getGridPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        const offsetX = (this.width - this.gridSize.w * TILE_SIZE) / 2;
        const offsetY = (this.height - this.gridSize.h * TILE_SIZE) / 2;
        const x = Math.floor((e.clientX - rect.left - offsetX) / TILE_SIZE);
        const y = Math.floor((e.clientY - rect.top - offsetY) / TILE_SIZE);
        return { x, y };
    },

    handleInput(e, type) {
        if (type !== 'down') return;
        const { x, y } = this.getGridPos(e);
        if (x < 0 || x >= this.gridSize.w || y < 0 || y >= this.gridSize.h) return;

        const tile = this.getTile(x, y);

        if (this.tool === 'cursor') {
            if (tile.building) {
                this.selectBuilding(tile.building);
            } else {
                this.deselect();
            }
        } else {
            // Place Building
            if (!tile.building) {
                let b = null;
                if (this.tool === 'miner') b = new Miner(x, y);
                if (this.tool === 'belt') b = new Belt(x, y);
                if (this.tool === 'processor') b = new Processor(x, y);
                if (this.tool === 'assembler') b = new Assembler(x, y);
                
                if (b) {
                    tile.building = b;
                    this.selectBuilding(b);
                }
            }
        }
    },

    setTool(toolName) {
        this.tool = toolName;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-tool="${toolName}"]`).classList.add('active');
        this.deselect();
    },

    selectBuilding(building) {
        this.selectedBuilding = building;
        const panel = document.getElementById('inspector');
        const content = document.getElementById('inspector-content');
        const title = document.getElementById('inspector-title');
        
        panel.style.display = 'block';
        title.innerText = `${building.type.toUpperCase()} [${building.x},${building.y}]`;
        
        content.innerHTML = '';

        // Generic Direction Control
        const dirRow = document.createElement('div');
        dirRow.className = 'logic-row';
        dirRow.innerHTML = `<label>方向:</label> <button onclick="Game.rotateSelected()">↻ 旋转</button>`;
        content.appendChild(dirRow);

        // Specific Controls
        if (building.type === 'miner') {
            this.createSelect(content, '形状', SHAPES, building.config.shape, v => building.config.shape = v);
            this.createSelect(content, '颜色', Object.keys(COLORS), building.config.color, v => building.config.color = v);
        }

        if (building.type === 'processor') {
            const logicContainer = document.createElement('div');
            logicContainer.style.borderTop = '1px solid #555';
            logicContainer.style.marginTop = '10px';
            logicContainer.style.paddingTop = '10px';
            
            const h4 = document.createElement('h4');
            h4.innerText = "逻辑规则 (Predicate)";
            h4.style.fontSize = '12px';
            h4.style.color = '#aaa';
            logicContainer.appendChild(h4);

            building.config.rules.forEach((rule, idx) => {
                const row = document.createElement('div');
                row.className = 'logic-row';
                row.style.flexWrap = 'wrap';
                
                // Property
                const propSel = document.createElement('select');
                ['shape', 'color', 'material'].forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.innerText = p;
                    if(p === rule.property) opt.selected = true;
                    propSel.appendChild(opt);
                });
                propSel.onchange = (e) => rule.property = e.target.value;

                // Value (Simplified for demo: just colors/shapes)
                const valSel = document.createElement('select');
                [...SHAPES, ...Object.keys(COLORS)].forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v; opt.innerText = v;
                    if(v === rule.value) opt.selected = true;
                    valSel.appendChild(opt);
                });
                valSel.onchange = (e) => rule.value = e.target.value;

                // Action
                const actSel = document.createElement('select');
                ['DELETE', 'PASS'].forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a; opt.innerText = a;
                    if(a === rule.action) opt.selected = true;
                    actSel.appendChild(opt);
                });
                actSel.onchange = (e) => rule.action = e.target.value;

                row.appendChild(propSel);
                row.appendChild(document.createTextNode('=='));
                row.appendChild(valSel);
                row.appendChild(document.createTextNode('→'));
                row.appendChild(actSel);

                logicContainer.appendChild(row);
            });

            const addBtn = document.createElement('button');
            addBtn.innerText = "+ 添加规则";
            addBtn.style.fontSize = '10px';
            addBtn.style.marginTop = '5px';
            addBtn.onclick = () => {
                building.config.rules.push({ active: true, type: 'EQUALS', property: 'color', value: 'RED', action: 'DELETE' });
                this.selectBuilding(building); // Refresh
            };
            logicContainer.appendChild(addBtn);

            content.appendChild(logicContainer);
        }

        // Delete Button
        const delBtn = document.createElement('button');
        delBtn.className = 'delete';
        delBtn.innerText = "拆除建筑";
        delBtn.onclick = () => {
            this.grid[building.y * this.gridSize.w + building.x].building = null;
            this.deselect();
        };
        content.appendChild(delBtn);
    },

    createSelect(parent, label, options, selectedVal, callback) {
        const row = document.createElement('div');
        row.className = 'logic-row';
        row.innerHTML = `<label>${label}:</label>`;
        const sel = document.createElement('select');
        options.forEach(opt => {
            const o = document.createElement('option');
            o.value = opt; o.innerText = opt;
            if(opt === selectedVal) o.selected = true;
            sel.appendChild(o);
        });
        sel.onchange = e => callback(e.target.value);
        row.appendChild(sel);
        parent.appendChild(row);
    },

    deselect() {
        this.selectedBuilding = null;
        document.getElementById('inspector').style.display = 'none';
    },

    rotateSelected() {
        if (this.selectedBuilding) {
            this.selectedBuilding.direction = (this.selectedBuilding.direction + 1) % 4;
        }
    },

    // --- Save/Load System ---
    saveGame() {
        const data = {
            grid: this.grid.map(tile => {
                if (!tile.building) return null;
                return {
                    x: tile.building.x,
                    y: tile.building.y,
                    type: tile.building.type,
                    direction: tile.building.direction,
                    config: tile.building.config
                };
            })
        };
        localStorage.setItem('logicFactorySave', JSON.stringify(data));
        this.showModal("存档成功", "游戏进度已保存到本地浏览器。");
    },

    loadGame() {
        const raw = localStorage.getItem('logicFactorySave');
        if (!raw) {
            // First time default setup
            this.setupDemo();
            return;
        }
        const data = JSON.parse(raw);
        this.createGrid(50, 50);
        data.grid.forEach(bData => {
            if (bData) {
                const tile = this.getTile(bData.x, bData.y);
                let b = null;
                if (bData.type === 'miner') b = new Miner(bData.x, bData.y);
                if (bData.type === 'belt') b = new Belt(bData.x, bData.y);
                if (bData.type === 'processor') b = new Processor(bData.x, bData.y);
                if (bData.type === 'assembler') b = new Assembler(bData.x, bData.y);
                
                if (b) {
                    b.direction = bData.direction;
                    b.config = bData.config;
                    tile.building = b;
                }
            }
        });
        this.showModal("读档成功", "欢迎回到工厂。");
    },

    resetGame() {
        localStorage.removeItem('logicFactorySave');
        location.reload();
    },

    setupDemo() {
        // Create a simple mining -> belt -> processing line
        const m = new Miner(10, 10);
        m.config.color = 'RED';
        this.getTile(10, 10).building = m;

        const b1 = new Belt(11, 10);
        this.getTile(11, 10).building = b1;
        
        const b2 = new Belt(12, 10);
        this.getTile(12, 10).building = b2;

        const p = new Processor(13, 10);
        // Set a logic: Delete Red items (So nothing comes out)
        p.config.rules = [{ active: true, type: 'EQUALS', property: 'color', value: 'RED', action: 'DELETE' }];
        this.getTile(13, 10).building = p;

        const b3 = new Belt(14, 10);
        this.getTile(14, 10).building = b3;
    },

    showModal(title, msg) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal-overlay').style.display = 'flex';
    }
};

// Start
window.onload = () => Game.init();

</script>
</body>
</html>
